<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Auditor AI Enterprise - Component-Driven SPA</title>

  <!-- Favicon Dinámico -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">

  <!-- Librerías Externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  

  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/components.css">
</head>

<body>

  <!-- HEADER GLOBAL -->
  <header class="app-header" style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; background: var(--bg-card); border-bottom: 1px solid var(--border-color);">
    <div class="brand" style="display: flex; align-items: center; gap: 0.75rem;">
      <div class="brand-icon">CV</div>
      <h1 style="font-size: 1.2rem; margin: 0;">CV Auditor <span>Enterprise</span></h1>
    </div>

    <!-- Monitor Ollama -->
    <div id="ollamaStatus" class="ollama-status offline">
      <span class="status-dot"></span>
      <span id="ollamaStatusText">Ollama Offline</span>
    </div>

    <!-- Tema -->
    <button id="themeToggleBtn" aria-label="Cambiar Tema" class="btn btn-secondary">
      <span id="themeIcon">☀️</span> Tema
    </button>
  </header>

  <!-- LAYOUT PRINCIPAL SPA -->
  <div class="app-spa-container">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar-nav">
      <button class="sidebar-nav-btn active" data-view="view-dashboard">
        <span class="nav-icon">🚀</span> Auditoría & Pipeline
      </button>
      <button class="sidebar-nav-btn" data-view="view-cover-letter">
        <span class="nav-icon">✉️</span> Carta Presentación
      </button>
      <button class="sidebar-nav-btn" data-view="view-interview">
        <span class="nav-icon">🎯</span> Entrevista STAR
      </button>
      <button class="sidebar-nav-btn" data-view="view-analytics">
        <span class="nav-icon">📊</span> Radar 360°
      </button>
      <button class="sidebar-nav-btn" data-view="view-comparator">
        <span class="nav-icon">⚔️</span> Comparador
      </button>
      <button class="sidebar-nav-btn" data-view="view-history">
        <span class="nav-icon">📜</span> Historial
      </button>
    </aside>

    <!-- ROUTER OUTLET (Aquí JavaScript renderizará los componentes independientes) -->
    <main id="app-router-outlet" class="main-view-container">
      <!-- Carga dinámicamente cada vista -->
    </main>

  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
